spring.application.name=commitfm-ai
server.port=8080
server.servlet.context-path=/api

# GitHub OAuth Configuration (Production)
github.client.id=${GITHUB_CLIENT_ID}
github.client.secret=${GITHUB_CLIENT_SECRET}
github.redirect.uri=${GITHUB_REDIRECT_URI:https://api.commitfm.io/api/auth/github/callback}
github.api.url=https://api.github.com

# Frontend Configuration
frontend.url=${FRONTEND_URL:https://commitfm.io}

# CORS Configuration
cors.allowed.origins=${CORS_ORIGINS:https://commitfm.io}

# Security
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=Strict
