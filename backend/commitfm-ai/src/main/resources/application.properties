spring.application.name=commitfm-ai
server.port=${PORT:8080}

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

github.client.id=${GITHUB_CLIENT_ID:your_github_client_id_here}
github.client.secret=${GITHUB_CLIENT_SECRET:your_github_client_secret_here}
github.redirect.uri=${GITHUB_REDIRECT_URI:http://localhost:8080/api/auth/github/callback}
frontend.url=${FRONTEND_URL:http://localhost:5173}